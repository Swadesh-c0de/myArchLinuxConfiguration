##############################################
#                                            #
#            OLED Charcoal Theme             #
#                                            #
##############################################

# Perfectly matched with Kitty OLED Charcoal theme
# Background: Neutral pitch-dark charcoal (#121214) with warm amber (#E78A4E),
# gold (#D8A657), sage green (#A9B665), terracotta (#EA6962), and soft white (#E4E4E8).
# Zero deep blue tint!

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

code_syntax_highlight = "monokai"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#E4E4E8"
full_screen_bg = "#121214"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#E78A4E", "#D8A657"]

#-- File Panel
file_panel_fg = "#E4E4E8"
file_panel_bg = "#121214"
file_panel_border = "#28282B"
file_panel_border_active = "#E78A4E"
file_panel_top_directory_icon = "#A9B665"
file_panel_top_path = "#E78A4E"
file_panel_item_selected_fg = "#121214"
file_panel_item_selected_bg = "#D4BE98"

#-- Footer
footer_fg = "#A8A8B2"
footer_bg = "#121214"
footer_border = "#28282B"
footer_border_active = "#A9B665"

#-- Sidebar
sidebar_fg = "#E4E4E8"
sidebar_bg = "#121214"
sidebar_title = "#E78A4E"
sidebar_border = "#121214"
sidebar_border_active = "#D8A657"
sidebar_item_selected_fg = "#121214"
sidebar_item_selected_bg = "#D4BE98"
sidebar_divider = "#484852"

#-- Modals
modal_fg = "#E4E4E8"
modal_bg = "#18181B"
modal_border_active = "#E78A4E"
modal_cancel_fg = "#121214"
modal_cancel_bg = "#EA6962"
modal_confirm_fg = "#121214"
modal_confirm_bg = "#A9B665"

#-- Help Menu
help_menu_hotkey = "#D8A657"
help_menu_title = "#E78A4E"

#-- Special
cursor = "#E78A4E"
correct = "#A9B665"
error = "#EA6962"
hint = "#7DAEA3"
cancel = "#EA6962"
