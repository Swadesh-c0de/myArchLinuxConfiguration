################################################################################
#                   KITTY TERMINAL CONFIGURATION                               #
#                   Modern, High-Aesthetic Dark Theme Setup                    #
################################################################################

#==============================================================================#
# 1. FONTS & TYPOGRAPHY
#==============================================================================#
font_family               JetBrainsMono Nerd Font
bold_font                 auto
italic_font               auto
bold_italic_font          auto
font_size                 12.0

# Ligatures: enable ligatures for code reading, unpack under cursor while editing
disable_ligatures         never

# Font metrics & vertical spacing
modify_font cell_height   115%
modify_font baseline      0

# Underline & box drawing
undercurl_style           thin-sparse
box_drawing_scale         0.001, 1, 1.5, 2

#==============================================================================#
# 2. WINDOW APPEARANCE & GEOMETRY
#==============================================================================#
# Luxurious padding for modern aesthetics
window_padding_width      12 16
placement_strategy        center

# Frameless design (KDE Plasma handles window shadows & rounded corners)
hide_window_decorations   yes

# Translucent glassmorphism & background blur
background_opacity        0.92
dynamic_background_opacity yes
background_blur           0

# Window layouts
enabled_layouts           splits,stack,tall,fat,grid
window_border_width       1pt
draw_minimal_borders      yes

# Window resize step
window_resize_step_cells  2
window_resize_step_lines  2

#==============================================================================#
# 3. CURSOR & MODERN TRAIL ANIMATION (Kitty 0.36+)
#==============================================================================#
cursor_shape              beam
cursor_beam_thickness     1.8
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# Smooth particle trailing animation
# Cursor trail disabled for zero-latency instant typing
cursor_trail              0

#==============================================================================#
# 4. TAB BAR
#==============================================================================#
tab_bar_edge              top
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_activity_symbol       "● "
active_tab_font_style     bold
inactive_tab_font_style   normal

# Clean dynamic tab titles displaying index & current directory
tab_title_template        " {index} {fmt.fg.tab}{tab.active_wd.split('/')[-1] or tab.active_wd} "
active_tab_title_template  " {index}  {tab.active_wd.split('/')[-1] or tab.active_wd} "

#==============================================================================#
# 5. SCROLLBACK, MOUSE & HYPERLINKS
#==============================================================================#
scrollback_lines          10000
wheel_scroll_multiplier   3.0
touch_scroll_multiplier   2.0
mouse_hide_wait           2.0

# Hyperlinks with hover underlines
url_style                 curly
open_url_with             default
detect_urls               yes
show_hyperlink_targets    yes
underline_hyperlinks      hover

# Copy & Paste
copy_on_select            no
strip_trailing_spaces     smart

#==============================================================================#
# 6. AUDIO & VISUAL BELL
#==============================================================================#
enable_audio_bell         no
visual_bell_duration      0.0
window_alert_on_bell      yes
bell_on_tab               "🔔 "

#==============================================================================#
# 7. PERFORMANCE & TERMINAL INTEGRATION
#==============================================================================#
confirm_os_window_close   0
allow_remote_control      yes
listen_on                 unix:@mykitty
shell_integration         enabled
repaint_delay             10
input_delay               3
sync_to_monitor           yes

#==============================================================================#
# 8. KEYBOARD SHORTCUTS & PRODUCTIVITY
#==============================================================================#
# --- Tabs ---
map ctrl+shift+t          new_tab_with_cwd
map ctrl+shift+w          close_tab
map ctrl+shift+right      next_tab
map ctrl+shift+left       previous_tab
map ctrl+shift+.          move_tab_forward
map ctrl+shift+,          move_tab_backward

# Direct Tab jumping (Alt + 1..9)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# --- Splits & Windows ---
# Inherit current working directory
map ctrl+shift+enter      launch --location=vsplit --cwd=current
map ctrl+shift+d          launch --location=hsplit --cwd=current
map ctrl+shift+s          launch --location=vsplit --cwd=current

# Zoom / Maximize active window toggle
map ctrl+shift+z          toggle_layout stack

# Vim-style Split navigation
map ctrl+shift+h          neighboring_window left
map ctrl+shift+l          neighboring_window right
map ctrl+shift+k          neighboring_window up
map ctrl+shift+j          neighboring_window down

# Split resizing mode (press arrows to resize, Esc to exit)
map ctrl+shift+r          start_resizing_window

# --- Font Resizing ---
map ctrl+shift+equal      change_font_size all +1.0
map ctrl+shift+plus       change_font_size all +1.0
map ctrl+shift+minus      change_font_size all -1.0
map ctrl+shift+backspace  change_font_size all 0

# --- Dynamic Background Opacity ---
map ctrl+shift+f10        set_background_opacity +0.02
map ctrl+shift+f11        set_background_opacity -0.02
map ctrl+shift+f12        set_background_opacity 0.92

# --- Kitten Hints ---
# Click or jump to URL in browser
map ctrl+shift+e          open_url_with_hints
# Insert file path at cursor
map ctrl+shift+p>f        kitten hints --type path --program -
# Insert git commit hash at cursor
map ctrl+shift+p>h        kitten hints --type hash --program -
# Insert line at cursor
map ctrl+shift+p>l        kitten hints --type line --program -

# --- Miscellaneous ---
# Clear scrollback & screen
map ctrl+shift+delete     combine : clear_terminal scrollback active : send_text normal,application \x0c
# Fullscreen toggle
map f11                   toggle_fullscreen

#==============================================================================#
# 9. COLOR THEME
#==============================================================================#
# Theme is managed via theme.conf
# You can also change themes dynamically with: kitten themes
include theme.conf
